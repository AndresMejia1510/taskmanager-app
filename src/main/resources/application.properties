spring.application.name=taskmanager-backend

# Configuración de MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?ssl-mode=REQUIRED
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
app.cors.allowed-origins=http://localhost:5173

# Clave secreta para JWT (mínimo 256 bits / 32 caracteres)
jwt.secret=ClaveSecretaSuperSeguraParaTaskManager2026!
jwt.expiration=86400000
