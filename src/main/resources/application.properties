spring.application.name=taskmanager-backend

# Configuración de MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/taskmanager_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
app.cors.allowed-origins=http://localhost:5173

# Clave secreta para JWT (mínimo 256 bits / 32 caracteres)
jwt.secret=ClaveSecretaSuperSeguraParaTaskManager2026!
jwt.expiration=86400000
